[package]
name = "tgws-rs"
version = "0.1.0"
edition = "2021"
description = "Rust prototype of tg-ws-proxy-server: MTProto-over-WebSocket bridge for Telegram (see docs/RUST_C.md)"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
tungstenite = { version = "0.24", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
