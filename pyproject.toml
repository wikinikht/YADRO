[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tg-ws-proxy-server"
dynamic=["version"]

description = "Server-oriented fork of tg-ws-proxy: MTProto-over-WebSocket bridge for Linux VPS (multi-secret, config generator, SOCKS5 bridge for bots)"
readme = "README.md"
requires-python = ">=3.8"

license = { name = "MIT", file = "LICENSE" }

authors = [
    { name = "Flowseal (upstream)" },
    { name = "tg-ws-proxy-server contributors (server fork)" },
]

keywords = [
    "telegram",
    "tdesktop",
    "proxy",
    "bypass",
    "websocket",
    "mtproto",
    "bot",
    "telethon",
    "pyrogram",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: No Input/Output (Daemon)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking :: Firewalls",
]

dependencies = [
    "pyyaml>=6.0",

    "pyperclip==1.9.0",
    "certifi",
    "httpx[http2]==0.28.1",

    "psutil==5.9.8; platform_system == 'Windows' and python_version < '3.9'",
    "cryptography==41.0.7; platform_system == 'Windows' and python_version < '3.9'",
    "Pillow==10.4.0; platform_system == 'Windows' and python_version < '3.9'",

    "psutil==7.0.0; platform_system != 'Windows' or python_version >= '3.9'",
    "cryptography==46.0.5; platform_system != 'Windows' or python_version >= '3.9'",
    "Pillow==12.1.1; (platform_system != 'Windows' or python_version >= '3.9') and platform_system != 'Darwin'",

    "customtkinter==5.2.2",
    "pystray==0.19.5",
    "pyobjc-framework-Cocoa>=9.0; platform_system == 'Darwin'",
    "Pillow==12.1.0; platform_system == 'Darwin'",
]

[project.optional-dependencies]
# golden e2e testing with a real MTProto client (no credentials needed)
golden = ["telethon>=1.36", "python-socks[asyncio]"]

[project.scripts]
tg-ws-proxy = "proxy.tg_ws_proxy:main"
tgws-server = "server.cli:main"
tg-ws-proxy-tray-win = "windows:main"
tg-ws-proxy-tray-macos = "macos:main"
tg-ws-proxy-tray-linux = "linux:main"

[project.urls]
Source = "https://github.com/wikinikht/YADRO"
Upstream = "https://github.com/Flowseal/tg-ws-proxy"
Issues = "https://github.com/wikinikht/YADRO/issues"

[tool.hatch.build.targets.wheel]
packages = ["proxy", "ui", "utils", "server"]

[tool.hatch.build.force-include]
"windows.py" = "windows.py"
"macos.py" = "macos.py"
"linux.py" = "linux.py"

[tool.hatch.version]
path = "proxy/__init__.py"

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4"]
ignore = ["F403", "F405", "B023"]

[tool.ruff.lint.per-file-ignores]
"macos.py" = ["E402"]
