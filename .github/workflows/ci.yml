name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout ruff
      - name: Ruff (critical errors only)
        run: ruff check proxy server utils tests --select E4,E7,E9,F
      - name: Unit tests (offline)
        run: python -m pytest tests/ -q --ignore=tests/test_live_e2e.py --timeout=120

  golden-e2e:
    # Real-network test: performs a full MTProto handshake through the
    # tunnel against live Telegram infrastructure (no credentials used).
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[golden]" pytest pytest-timeout
      - name: Live e2e
        env:
          TGWS_LIVE: '1'
        run: python -m pytest tests/test_live_e2e.py -q --timeout=180

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check (prototype)
        working-directory: rust
        run: cargo check --all-targets
      - name: cargo test (prototype)
        working-directory: rust
        run: cargo test
